# Conda environment for the FoRGe artifact.
#
#   conda env create -f environment.yml
#   conda activate forge
#
# Python 3.10+ is required: eval_test_split/_scoring.py uses PEP 604 union
# syntax (`RegexEngine | PythonEngine`), which is a SyntaxError on 3.9.
name: forge
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - pip:
      - google-genai>=1.0.0
      - python-dotenv>=1.0.0
      - openai>=2.0.0
      - requests>=2.31.0
      - urllib3>=2.0.0
      - pyarrow>=14.0.0
      - matplotlib>=3.7.0
